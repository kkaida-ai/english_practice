<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>しゃべって英会話</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫛</text></svg>" />
  <meta name="theme-color" content="#4f9d36" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="英会話" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>しゃべって英会話 <span class="sub">Free Talk</span></h1>
    <div class="stats" id="stats"></div>
    <nav class="top-actions">
      <button id="wordsBtn" class="btn ghost">単語帳 <span id="dueBadge" class="badge" hidden></span></button>
      <button id="settingsBtn" class="btn ghost">設定</button>
      <button id="newBtn" class="btn ghost">新しい会話</button>
      <button id="mobileBtn" class="btn ghost" hidden>📱 スマホで使う</button>
    </nav>
  </header>

  <main class="layout">
    <section class="stage">
      <div id="character" class="character" data-state="idle"></div>
      <div class="thinking-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="char-name" id="charName"></div>
      <div id="status" class="status">マイクをタップして話しかけてね</div>
      <div class="toggles" role="group" aria-label="表示切り替え">
        <button class="toggle" data-key="showEnglish">英文</button>
        <button class="toggle" data-key="showJapanese">日本語訳</button>
        <button class="toggle" data-key="showMine">自分の発言</button>
      </div>
    </section>

    <section class="chat">
      <div id="log" class="log" aria-live="polite"></div>

      <div id="suggest" class="suggest" hidden>
        <button id="hintBtn" class="hint-toggle">💡 返答のヒントを見る</button>
        <div id="suggestList" class="suggest-list" hidden></div>
      </div>

      <div id="interim" class="interim" hidden></div>

      <div class="composer">
        <button id="langBtn" class="lang-btn" title="話す言語を切り替え（詰まったら日本語で言ってもOK）">EN</button>
        <button id="micBtn" class="mic-btn" aria-label="話す">
          <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        </button>
        <form id="textForm" class="text-form">
          <input id="textInput" autocomplete="off" placeholder="キーボードで入力もできます" />
          <button class="btn primary" type="submit">送信</button>
        </form>
      </div>
    </section>
  </main>

  <!-- 単語ポップアップ -->
  <div id="wordPop" class="word-pop" hidden></div>

  <!-- 設定 -->
  <dialog id="settingsDlg" class="dlg">
    <form method="dialog" class="dlg-inner">
      <h2>設定</h2>

      <fieldset>
        <legend>話し相手（ボイス）</legend>
        <div class="char-choices" id="charChoices"></div>
        <label class="row" id="zundaRow">ずんだもんの声
          <select id="zundaSpeaker">
            <option value="3">ノーマル</option>
            <option value="1">あまあま</option>
            <option value="7">ツンツン</option>
            <option value="5">セクシー</option>
            <option value="22">ささやき</option>
            <option value="38">ヒソヒソ</option>
            <option value="75">ヘロヘロ</option>
            <option value="76">なみだめ</option>
          </select>
        </label>
        <label class="row" id="voiceRow">英語ボイス
          <select id="voiceSelect"></select>
        </label>
        <p class="note" id="voicevoxNote"></p>
        <label class="row">話す速さ <input id="speed" type="range" min="0.6" max="1.4" step="0.05" /> <output id="speedOut"></output></label>
        <button type="button" id="testVoice" class="btn">声を試す</button>
      </fieldset>

      <fieldset>
        <legend>会話</legend>
        <label class="row">レベル
          <select id="level">
            <option value="beginner">初級（やさしい英語）</option>
            <option value="intermediate">中級（ふつう）</option>
            <option value="advanced">上級（ネイティブ並み）</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="correction" /> 自分の英語を添削してもらう</label>
        <label class="check"><input type="checkbox" id="useReviewWords" /> 単語帳の単語を会話に混ぜてもらう</label>
        <label class="check"><input type="checkbox" id="handsFree" /> ハンズフリー（AIが話し終わったら自動でマイクON）</label>
        <label class="row">音声認識
          <select id="sttEngine">
            <option value="whisper">Whisper（日本人の英語に強い・おすすめ）</option>
            <option value="browser">ブラウザ（Google）</option>
          </select>
        </label>
        <p class="note" id="sttNote"></p>
        <label class="row">自動送信までの無音時間 <input id="silenceSec" type="range" min="1" max="5" step="0.5" /> <output id="silenceOut"></output></label>
      </fieldset>

      <div class="dlg-actions"><button class="btn primary">閉じる</button></div>
    </form>
  </dialog>

  <!-- 単語帳 -->
  <dialog id="wordsDlg" class="dlg wide">
    <div class="dlg-inner">
      <div class="dlg-head">
        <h2>単語帳</h2>
        <div class="tabs" role="tablist">
          <button class="tab" data-tab="review" role="tab">復習</button>
          <button class="tab" data-tab="list" role="tab">一覧</button>
        </div>
        <button class="btn ghost close" id="wordsClose" aria-label="閉じる">✕</button>
      </div>
      <div id="wordsBody"></div>
    </div>
  </dialog>

  <!-- スマホで使う -->
  <dialog id="mobileDlg" class="dlg">
    <form method="dialog" class="dlg-inner">
      <h2>📱 スマホで使う</h2>
      <div id="mobileBody"></div>
      <div class="dlg-actions"><button class="btn primary">閉じる</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <footer class="credit">音声: <span id="creditText">VOICEVOX:ずんだもん</span> ／ 会話AI: <span id="aiLabel">Claude</span></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
