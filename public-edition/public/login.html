<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>しゃべって英会話</title>
  <meta name="theme-color" content="#4f9d36" />
  <link rel="icon" href="icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">
  <main class="login-box">
    <img src="icon.svg" alt="" width="64" height="64" />
    <h1>しゃべって英会話</h1>
    <p class="note">ずんだもんやリリーと、英語でフリートークしよう。<br>管理者から教えてもらった合言葉を入力してください。</p>
    <form id="loginForm">
      <input id="password" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉（例: mochi-tiger-1234）" required />
      <button class="btn primary" type="submit">はじめる</button>
    </form>
    <p id="loginError" class="note warn" hidden></p>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
